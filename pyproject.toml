[project]
name = "ai-engineer-roadmap"
version = "0.1.0"
description = "A structured, evidence-based curriculum for becoming a production-ready AI Engineer."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# `python -m pytest` from the repository root verifies the REPOSITORY: the
# curriculum data, the generators, the status calculations and the review
# scheduler. It must be green at all times.
#
# Lesson exercise tests are deliberately NOT collected here, because they are
# meant to fail until the learner implements the exercise. Run those explicitly:
#
#   python -m pytest phases                      all exercises
#   python -m pytest phases/01-foundations/...   one lesson
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
# Optional. Not required by any script or test.
line-length = 100
target-version = "py311"
